<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';" />
  <title>Webring Studio</title>
  <!--
    Start-up splash (electron/splash.ts). Everything is CSS and finishes within 2.8 s, when the
    window closes: logo spins up from small, "Webring" slides in from the left and "Studio" from
    the right, then the credit fades in and the whole splash fades out. It starts when splash.ts
    adds the "play" class, as the window appears.
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #090d16; color: #f8fafc; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-user-select: none; user-select: none; cursor: default;
    }
    .logo, .webring, .studio, .credit { opacity: 0; }
    .play { animation: out 0.3s ease-in 2.5s forwards; }
    .logo { width: 220px; height: 220px; }
    .play .logo { animation: spin-up 1.1s cubic-bezier(0.33, 0.9, 0.4, 1.04) both; }
    .title {
      display: flex; gap: 0.4em; margin-top: 22px;
      font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
    }
    .play .webring { animation: from-left 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both; }
    .play .studio { animation: from-right 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both; }
    .studio {
      background: linear-gradient(90deg, #818cf8, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .credit {
      margin-top: 18px; font-size: 13px; letter-spacing: 0.04em; color: #94a3b8;
    }
    .play .credit { animation: fade-in 0.6s ease-out 1.45s both; }
    @keyframes spin-up {
      from { transform: scale(0.12) rotate(-300deg); opacity: 0; }
      60% { opacity: 1; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes from-left { from { transform: translateX(-60vw); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes from-right { from { transform: translateX(60vw); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes out { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .play .logo, .play .webring, .play .studio { animation: fade-in 0.4s ease-out both; }
      .play .credit { animation: fade-in 0.4s ease-out 0.4s both; }
    }
  </style>
</head>
<body>
  <img class="logo" src="splash-logo.png" alt="" />
  <div class="title" aria-label="Webring Studio"><span class="webring">Webring</span><span class="studio">Studio</span></div>
  <p class="credit">Envisioned &amp; Orchestrated by Corey Lines</p>
</body>
</html>
